<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="websheet2.css">
</head>
<body>
    <h1>
                WELCOME TO STUDENT REGISTRATION:
    </h1>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
    </div>
    <div>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>
    </div>
    <div>
        <label for="Eamcet">Eamcet Rank:</label>
        <input type="text" id="Eamcet" name="Eamcet"><br><br>
    </div>
    <div>   
        <label for="Inter">Intermediate Percentage:</label>
        <input type="text" id="Inter" name="Inter"><br><br>
    </div>
    <div>
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="phd">Ph.D</option>
        </select><br><br>
        <button type="submit">Submit</button>
    </div>
</body>
</html>
