<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>
        This is a Calculator application made by me 
    </h1>
    <label for="num1">First number:</label>
    <input type="number" id="num1"><br><br>
    <label for="num2">Second number:</label>
    <input type="number" id="num2"><br><br>
    <button onclick="addition()">Addition</button>
    <p id="add">Addition</p>

    <script>
        function addition(){
            let a=Number(document.getElementById("num1").value)
            let b=Number(document.getElementById("num2").value)
            let res=a+b;
            document.getElementById("add").innerText=`Addition: ${res}`;
        }
    </script>
    

    <button onclick="Maximum()">Maximum</button>
    <p id="Max">Maximum</p>
    <script>
        function Maximum(){
            let a=Number(document.getElementById("num1").value)
            let b=Number(document.getElementById("num2").value)
            if(a>b){
                document.getElementById("Max").innerText=`Maximum number: ${a}`;
            }
            else{
                document.getElementById("Max").innerText=`Maximum number: ${b}`;
            }
        }
    </script>

    <button onclick="Print()">Print Numbers</button>
    <p id="Printing">Numbers:</p>

    <script>
        function Print(){
            let a=Number(document.getElementById("num1").value)
            let b=Number(document.getElementById("num2").value)
            for(let i=a; i<=b; i++){
                document.getElementById("Printing").innerText+=`${i}\n`;
            }
        }
    </script>
    
</body>
</html>
